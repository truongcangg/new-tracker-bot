name: Trading Terminal Scheduler

# Lich chay chinh gio la cron-job.org goi API "workflow_dispatch" ben duoi moi 20
# phut (dang tin cay hon nhieu so voi trigger "schedule" noi bo cua GitHub, von
# chi la best-effort va co the bi tre hang gio). workflow_dispatch cung cho phep
# ban bam "Run workflow" tren tab Actions de chay tay bat cu luc nao.
on:
  workflow_dispatch: {}

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scraper.txt

      # QUAN TRONG: chay scraper.py (khong phu thuoc Streamlit) thay vi main.py.
      # main.py la mot script Streamlit - chay no bang "python main.py" (khong phai
      # "streamlit run") khong dam bao logic cao du lieu thuc thi dung/on dinh.
      - name: Run Tracker Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py
