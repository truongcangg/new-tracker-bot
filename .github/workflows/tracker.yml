name: Trading Terminal Scheduler

on:
  schedule:
    - cron: "*/20 * * * *"   # moi 20 phut - GitHub co the tre vai phut so voi lich neu repo it hoat dong
  workflow_dispatch: {}        # cho phep bam "Run workflow" tren tab Actions de chay tay/test

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scraper.txt

      # QUAN TRONG: chay scraper.py (khong phu thuoc Streamlit) thay vi main.py.
      # main.py la mot script Streamlit - chay no bang "python main.py" (khong phai
      # "streamlit run") khong dam bao logic cao du lieu thuc thi dung/on dinh.
      - name: Run Tracker Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py
